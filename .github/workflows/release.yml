name: Release

# 触发：手动 / 推 tag (v*)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：手动触发时的版本号（如 v1.5.3），不填则用 dev-<commit>'
        required: false
        default: ''

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Setup MSYS2 (MinGW gcc for CGO)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
          update: false

      - name: Add MinGW to PATH
        run: |
          echo "${{ runner.temp }}\msys64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # 兜底：标准 msys2 安装路径
          echo "C:\msys64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        shell: pwsh

      - name: Verify toolchain
        run: |
          go version
          gcc --version
          node --version
          npm --version
        shell: pwsh

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
        shell: pwsh

      - name: Resolve version tag
        id: ver
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          if ("$env:GITHUB_REF_TYPE" -ne "tag") {
            if ("${{ inputs.tag }}" -ne "") {
              $tag = "${{ inputs.tag }}"
            } else {
              $short = (git rev-parse --short HEAD)
              $tag = "dev-$short"
            }
          }
          "tag=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "Version: $tag"
        shell: pwsh

      - name: Build EXE (CGO)
        env:
          CGO_ENABLED: '1'
        run: |
          go build -trimpath -ldflags "-s -w -X main.Version=${{ steps.ver.outputs.tag }}" -o wetrace.exe .
          dir wetrace.exe
        shell: pwsh

      - name: Package release zip
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item wetrace.exe dist\wetrace.exe
          Copy-Item README.md dist\ -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist\ -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG.md dist\ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\wetrace.exe, dist\README.md, dist\LICENSE, dist\CHANGELOG.md `
            -DestinationPath "dist\wetrace-pro-${{ steps.ver.outputs.tag }}-windows-amd64.zip"
          dir dist
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wetrace-pro-${{ steps.ver.outputs.tag }}
          path: |
            dist/wetrace.exe
            dist/wetrace-pro-*-windows-amd64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Wetrace Pro ${{ steps.ver.outputs.tag }}
          files: |
            dist/wetrace.exe
            dist/wetrace-pro-*-windows-amd64.zip
          generate_release_notes: true
          body: |
            ## Wetrace Pro ${{ steps.ver.outputs.tag }}

            完整改动详见 [CHANGELOG.md](CHANGELOG.md)。

            ### 下载
            - **`wetrace.exe`** — 单个可执行文件，直接双击运行（启动后自动在 `127.0.0.1:5200` 打开浏览器）
            - **`wetrace-pro-*-windows-amd64.zip`** — 压缩包，含 README + LICENSE + CHANGELOG

            ### 启动
            ```powershell
            .\wetrace.exe
            ```

            ### 系统要求
            - Windows x64
            - 无需额外安装运行时（CGO sqlite3 已静态链接）

            ---
            🤖 自动构建于 GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
